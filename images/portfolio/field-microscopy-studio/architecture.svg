<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290"><rect width="1200" height="290" rx="24" fill="#10171c"/><style>text{font-family:Arial,sans-serif;fill:#e9f6f1}.small{font-size:15px;fill:#acbdb7}.title{font-size:21px;font-weight:bold}</style><text x="40" y="47" class="title">FIELD · an inspectable image-analysis workflow</text><rect x="40" y="90" width="250" height="100" rx="12" fill="#1a2b2b" stroke="#63ccb4"/><text x="55" y="130" class="title">Source stack</text><text x="55" y="160" class="small">Channels · planes · spacing</text><path d="M298 140h25l-8-7m8 7-8 7" stroke="#63ccb4" fill="none" stroke-width="2"/><rect x="330" y="90" width="250" height="100" rx="12" fill="#1a2b2b" stroke="#63ccb4"/><text x="345" y="130" class="title">Processing run</text><text x="345" y="160" class="small">Recipe · labels · provenance</text><path d="M588 140h25l-8-7m8 7-8 7" stroke="#63ccb4" fill="none" stroke-width="2"/><rect x="620" y="90" width="250" height="100" rx="12" fill="#1a2b2b" stroke="#63ccb4"/><text x="635" y="130" class="title">Linked review</text><text x="635" y="160" class="small">XY / XZ / YZ · measurements</text><path d="M878 140h25l-8-7m8 7-8 7" stroke="#63ccb4" fill="none" stroke-width="2"/><rect x="910" y="90" width="250" height="100" rx="12" fill="#1a2b2b" stroke="#63ccb4"/><text x="925" y="130" class="title">Manual observations</text><text x="925" y="160" class="small">Points · outlines · traces</text><text x="40" y="244" class="small">Source images stay distinct from algorithm proposals and reviewer decisions. Demonstration imagery is simulated.</text></svg>
