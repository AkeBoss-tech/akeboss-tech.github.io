name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      # PostHog browser project keys are publishable by design. These must be
      # present while Next.js builds the static bundle, not only at runtime.
      NEXT_PUBLIC_POSTHOG_KEY: phc_QbuandPEuH8hHoDd24tQIrYXD88rexZBoyERqy435te
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun ci

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static site
        run: |
          bun run build
          bun run redirects:build

      - name: Compile LaTeX resume
        run: |
          mkdir -p public/files out/files
          tectonic files/resume.tex -o public/files/
          cp public/files/resume.pdf out/files/resume.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
